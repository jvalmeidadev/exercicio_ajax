<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <img id="avatar" class="profile-avatar" src="https://via.placeholder.com/180x180" alt=".">
            <h1 id="name" class="profile-name">João Victor Almeida</h1>
            <h2 id="username" class="profile-username">@jvalmeidadev</h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <span id="repos">0</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="followers">0</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="following">0</span>
                </li>
            </ul>
            <a id="link" href="#" class="profile-link">Ver no Github</a>
        </div>
    </header>

    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            const nameElement = document.querySelector('#name');
            const usernameElement = document.querySelector('#username');
            const avatarElement = document.querySelector('#avatar');
            const reposElement = document.querySelector('#repos');
            const followersElement = document.querySelector('#followers');
            const followingElement = document.querySelector('#following');
            const linkElement = document.querySelector('#link');

            try {
                
                const response = await fetch('https://api.github.com/users/jvalmeidadev');

                
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                const json = await response.json();

                
                nameElement.innerText = json.name ? json.name : json.login;
                usernameElement.innerText = '@' + json.login;
                avatarElement.src = json.avatar_url;
                reposElement.innerText = json.public_repos;
                followersElement.innerText = json.followers;
                followingElement.innerText = json.following;
                linkElement.href = json.html_url;

            } catch (error) {
                
                console.error('Erro ao carregar os dados do GitHub:', error);
                nameElement.innerText = "Erro ao carregar dados!";
                usernameElement.innerText = "@erro";
            }
        });
    </script>
</body>
</html>
